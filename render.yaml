# Render deployment blueprint for the BTST engine (FREE tier).
# Free tier sleeps on inactivity — UptimeRobot (see DEPLOY.md) keeps it awake so
# the 15:20 IST scheduler always fires.
#
# NOTE: free tier has NO persistent disk, so the SQLite DB lives in the container's
# ephemeral filesystem and is wiped on every restart/redeploy. That's fine for the
# paper trial — Telegram entry/exit reports are the durable record; the dashboard
# shows data since the last restart. For full persistence, move to a paid plan and
# re-add a `disk:` block mounted at /app/data.
services:
  - type: web
    name: btst-engine
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "8085"
      - key: PAPER_MODE
        value: "true" # flip to false only after the 30-day paper run
      - key: BTST_DB
        value: /app/data/btst.db # local fallback only; used when TURSO_* unset
      # Durable storage (Turso / libSQL, free tier) — REQUIRED so overnight BTST
      # positions survive restarts/redeploys. Set both in the Render dashboard.
      - key: TURSO_DATABASE_URL
        sync: false # e.g. libsql://btst-<org>.turso.io
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: BTST_SCREENER
        value: pur-ema10-20
      - key: BTST_CAPITAL_PER_DAY
        value: "500000"
      - key: BTST_STOP_LOSS_PCT
        value: "6.5"
      # Automated sentiment gates OFF — manual Telegram BUY approval replaces them.
      - key: BTST_GATE_ENABLED
        value: "false"
      # Manual BUY approval: engine proposes the basket, buys only on PROCEED reply.
      - key: BTST_APPROVAL
        value: "true"
      - key: BTST_APPROVAL_DEADLINE
        value: "15:28" # auto-HOLD if no reply by this IST time (before 15:30 close)
      # Manual scan+trade trigger (/api/run). Empty = disabled. Set a long random
      # secret in the Render dashboard to enable testing outside 15:20.
      - key: BTST_TRIGGER_TOKEN
        sync: false
      # Optional LLM news second-opinion (only used if gates are re-enabled).
      - key: BTST_NEWS_LLM
        value: "false"
      - key: ANTHROPIC_API_KEY
        sync: false # only needed when BTST_NEWS_LLM=true
      # Secrets — set these in the Render dashboard, not here:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_IDS
        sync: false
      # Kite creds only needed for live mode (PAPER_MODE=false):
      - key: KITE_API_KEY
        sync: false
      - key: KITE_API_SECRET
        sync: false
      - key: ZERODHA_USER_ID
        sync: false
      - key: ZERODHA_PASSWORD
        sync: false
      - key: ZERODHA_TOTP_SECRET
        sync: false
